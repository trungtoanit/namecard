<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Namecard · Nguyễn Trung Toán</title>
<link rel="icon" href="assets/logo-gold.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Montserrat:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/qr-art.js"></script>
<style>
  html,body{margin:0;background:#070708;color:#e6d7b6;font-family:Montserrat,sans-serif}
  body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;box-sizing:border-box}
  canvas{width:min(92vw,calc((100svh - 110px) * .8));height:auto;border-radius:24px;box-shadow:0 30px 90px -20px rgba(214,170,90,.45)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .bar a,.bar button{font:500 13px Montserrat,sans-serif;letter-spacing:.06em;color:#1a1408;background:linear-gradient(120deg,#a8874c,#f3e2b5 50%,#a8874c);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none}
  .bar .ghost{background:none;color:#f3e2b5;border:1px solid #a8874c}
  body.raw{padding:0;gap:0}body.raw canvas{width:1000px;border-radius:0;box-shadow:none}body.raw .bar{display:none}
</style>
</head>
<body>
<canvas id="qr" width="1000" height="1250"></canvas>
<div class="bar">
  <button id="dl">Tải ảnh QR · Download</button>
  <a class="ghost" href="./">Mở namecard</a>
</div>
<script>
const URL_CARD='https://trungtoanit.github.io/namecard/';
const T={
  vi:{brand:'BAO BÌ TUẤN TÚ',brandSub:'TUAN TU PACKAGING',name:'NGUYỄN TRUNG TOÁN',title:'Chủ Tịch HĐQT | Chairman',cta:'Quét để kết nối'},
  en:{brand:'TUAN TU PACKAGING',brandSub:'BAO BÌ TUẤN TÚ',name:'NGUYEN TRUNG TOAN',title:'Chairman of the Board',cta:'Scan to connect'},
  zh:{brand:'俊秀包装',brandSub:'TUAN TU PACKAGING',name:'阮忠算',title:'董事长 | Chairman',cta:'扫码联系我'},
};
const q=new URLSearchParams(location.search);
let lang=q.get('lang');
if(!T[lang]){const l=(navigator.language||'').toLowerCase();lang=l.startsWith('vi')?'vi':l.startsWith('zh')?'zh':l.startsWith('en')?'en':'vi'}
if(q.has('raw'))document.body.classList.add('raw');
drawShareQR(document.getElementById('qr'),{url:URL_CARD,...T[lang],logo:'assets/logo-gold.png'}).then(()=>document.body.dataset.ready='1');
document.getElementById('dl').onclick=()=>document.getElementById('qr').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='QR-Namecard-NguyenTrungToan.png';a.click()},'image/png');
</script>
</body>
</html>
