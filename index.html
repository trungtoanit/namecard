<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEO Digital Card 5.0 · Bao Bì Tuấn Tú</title>
<meta name="description" content="CEO Digital Card 5.0 – Bao Bì Tuấn Tú | Tuan Tu Packaging Executive Edition">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="assets/logo-gold.png" type="image/png">
<meta property="og:image" content="assets/logo-gold.png">
<meta property="og:title" content="CEO Digital Card 5.0 · Bao Bì Tuấn Tú">
<meta property="og:description" content="Tuan Tu Packaging – Executive Edition">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b0b0d; --bg2:#141418; --panel:rgba(22,22,27,.72); --line:rgba(214,186,128,.22);
  --gold:#d6ba80; --gold2:#f3e2b5; --gold3:#a8874c; --text:#ece7dc; --muted:#9b958a;
  --radius:20px; --serif:"Cormorant Garamond","Noto Serif SC",serif; --sans:"Be Vietnam Pro",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.gold-text{background:linear-gradient(100deg,var(--gold3),var(--gold2) 40%,var(--gold) 60%,var(--gold3));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% center}}

/* ---------- Top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(11,11,13,.85),transparent);transition:background .4s}
.topbar.solid{background:rgba(11,11,13,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;letter-spacing:.08em}
.logo{width:38px;height:38px;display:grid;place-items:center;position:relative}
.logo img{width:30px;height:30px}
.logo::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold2);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.35)}
.langs button{background:none;border:0;padding:5px 11px;border-radius:999px;font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--muted);transition:.3s}
.langs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1408;font-weight:600}

/* ---------- Hero video ---------- */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;display:flex;align-items:flex-end}
.hero video,.hero canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 0,rgba(11,11,13,.35) 55%,rgba(11,11,13,.95) 100%),linear-gradient(to top,var(--bg) 2%,transparent 45%)}
.hero-inner{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;padding:0 22px 40px}
.eyebrow{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(40px,9vw,92px);line-height:1;margin:12px 0 10px;letter-spacing:.02em}
.hero p.lead{max-width:560px;color:#cfc8ba;font-size:15px}
.vid-switch{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1px solid var(--line);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;font-size:12px;cursor:pointer;transition:.3s;letter-spacing:.03em}
.chip:hover,.chip.on{border-color:var(--gold);color:var(--gold2)}
.chip input{display:none}
.scroll-cue{position:absolute;left:50%;bottom:14px;z-index:2;transform:translateX(-50%);width:22px;height:36px;border:1px solid var(--gold3);border-radius:12px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* ---------- Sections ---------- */
section{max-width:1100px;margin:0 auto;padding:80px 22px}
.sec-head{text-align:center;margin-bottom:38px}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.1;margin-top:8px}
.divider{width:60px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- 3D NFC card ---------- */
.card-stage{perspective:1400px;display:flex;justify-content:center;padding:10px 0 4px}
.card3d{width:min(92vw,440px);aspect-ratio:1.586;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card3d.flip .flipper{transform:rotateY(180deg)}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.9,.25,1)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
   radial-gradient(circle at 20% 0%,#3a3a40,#17171b 55%,#0c0c0e);
  box-shadow:0 40px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(214,186,128,.35) inset,0 1px 0 rgba(255,255,255,.12) inset;padding:7% 7.5%}
.face.back{transform:rotateY(180deg)}
.face .glare{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,240,200,.16) 48%,rgba(255,255,255,.28) 50%,rgba(255,240,200,.12) 52%,transparent 60%);transform:translateX(var(--gx,-30%));pointer-events:none;mix-blend-mode:screen}
.face .border{position:absolute;inset:10px;border:1px solid rgba(214,186,128,.28);border-radius:12px;pointer-events:none}
.f-top{display:flex;justify-content:space-between;align-items:flex-start}
.f-logo{font-family:var(--serif);font-size:clamp(16px,4.4vw,22px);letter-spacing:.16em;line-height:1.1}
.f-logo small{display:block;font-family:var(--sans);font-size:clamp(7px,1.9vw,9px);letter-spacing:.42em;color:var(--muted);margin-top:4px}
.nfc{width:clamp(22px,6vw,30px);opacity:.9}
.chipgold{position:absolute;left:7.5%;top:42%;width:13%;aspect-ratio:1.3;border-radius:6px;background:linear-gradient(135deg,#f7e7bd,#b8955a 55%,#e8d199);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chipgold::before{content:"";position:absolute;inset:22% 30%;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.f-name{position:absolute;left:7.5%;right:7.5%;bottom:9%}
.f-name b{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(18px,5.2vw,26px);letter-spacing:.08em}
.f-name span{font-size:clamp(8px,2.2vw,11px);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.back-grid{display:grid;grid-template-columns:1fr auto;gap:6%;height:100%;align-items:center}
.back-info{font-size:clamp(9px,2.5vw,12px);line-height:1.9;color:#d9d2c2}
.back-info .t{font-family:var(--serif);font-size:clamp(14px,4vw,19px);color:var(--gold2);letter-spacing:.1em;margin-bottom:6px;line-height:1.2}
.qrbox{background:#f6efe0;padding:6px;border-radius:8px;width:clamp(78px,24vw,118px);aspect-ratio:1;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important}
.card-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.08em}
.card-hint b{color:var(--gold);font-weight:500}

/* ---------- Profile & actions ---------- */
.profile{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:46px auto 0;max-width:720px;backdrop-filter:blur(10px)}
.avatar{width:120px;height:120px;border-radius:50%;padding:2px;background:conic-gradient(from 0deg,var(--gold3),var(--gold2),var(--gold3),var(--gold),var(--gold3));animation:spin 10s linear infinite}
.avatar>div{width:100%;height:100%;border-radius:50%;background:#1a1a1f center/cover;display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:var(--gold);animation:spin 10s linear infinite reverse}
.profile h3{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1}
.profile .role{color:var(--gold);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-top:4px}
.profile .quote{color:#bdb6a8;font-size:14px;margin-top:10px;font-style:italic}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:720px;margin:18px auto 0}
.act{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#1b1b20,#111114);cursor:pointer;font-size:12.5px;letter-spacing:.04em;transition:transform .3s,border-color .3s}
.act:hover{transform:translateY(-3px);border-color:var(--gold)}
.act svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.5}
.act::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(243,226,181,.18),transparent);transform:skewX(-20deg);animation:sweep 4.5s ease-in-out infinite}
.act:nth-child(2)::after{animation-delay:.5s}.act:nth-child(3)::after{animation-delay:1s}.act:nth-child(4)::after{animation-delay:1.5s}.act:nth-child(5)::after{animation-delay:2s}.act:nth-child(6)::after{animation-delay:2.5s}
@keyframes sweep{0%,60%{left:-120%}100%{left:160%}}
.btn-primary{display:block;max-width:720px;margin:14px auto 0;text-align:center;padding:16px;border-radius:14px;border:0;width:100%;cursor:pointer;background:linear-gradient(120deg,var(--gold3),var(--gold2) 50%,var(--gold3));background-size:200% auto;color:#1a1408;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;animation:shine 5s linear infinite}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{text-align:center;padding:26px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(34px,6vw,50px);font-weight:600;line-height:1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em}

/* ---------- Showroom ---------- */
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prod{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#121215;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;transition:transform .5s,border-color .5s}
.prod:hover{transform:translateY(-4px);border-color:var(--gold)}
.prod .art{position:absolute;inset:0;display:grid;place-items:center;opacity:.9}
.prod .art svg{width:46%;stroke:var(--gold);fill:none;stroke-width:1;filter:drop-shadow(0 0 18px rgba(214,186,128,.25));transition:transform .8s}
.prod:hover .art svg{transform:scale(1.08) rotate(-3deg)}
.prod::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,13,.96) 20%,transparent 70%);z-index:1}
.prod>*:not(.art){position:relative;z-index:2}
.prod h4{font-family:var(--serif);font-size:22px;font-weight:600}
.prod p{font-size:13px;color:var(--muted)}
.capab{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.cap{display:flex;gap:14px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.cap i{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold3);display:grid;place-items:center;font-style:normal;color:var(--gold);font-family:var(--serif)}
.cap b{font-weight:500;display:block}
.cap span{font-size:13px;color:var(--muted)}

/* ---------- Quote form ---------- */
.form{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{background:#0f0f12;border:1px solid #2a2a30;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .3s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--gold)}
.form textarea{min-height:100px;resize:vertical}
.form-actions{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr;gap:10px}
.form-actions .btn-primary{margin:0}
.btn-ghost{border:1px solid var(--gold3);background:none;border-radius:14px;cursor:pointer;color:var(--gold2);font-size:13px;letter-spacing:.06em}

/* ---------- Footer / modal / toast ---------- */
footer{text-align:center;padding:40px 22px 60px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
footer .f-brand{font-family:var(--serif);font-size:22px;color:var(--text);letter-spacing:.12em;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);padding:20px}
.modal.open{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal-box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-align:center;max-width:340px;width:100%}
.modal-box h3{font-family:var(--serif);font-size:24px;margin-bottom:14px}
.modal-box .qrbox{width:220px;margin:0 auto 14px;padding:10px}
.modal-box p{font-size:13px;color:var(--muted)}
.modal-box button{margin-top:16px;width:100%;padding:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;z-index:120;background:var(--gold2);color:#1a1408;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;transition:.4s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  section{padding:64px 18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .products{grid-template-columns:1fr}
  .capab{grid-template-columns:1fr}
  .form{grid-template-columns:1fr;padding:20px}
  .profile{grid-template-columns:1fr;text-align:center;justify-items:center}
  .brand .name{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand"><div class="logo"><img src="assets/logo-gold.png" alt="Tuấn Tú logo"></div><span class="name">TUẤN TÚ</span></div>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="vi" class="on">VI</button>
    <button data-lang="en">EN</button>
    <button data-lang="zh">中文</button>
  </div>
</header>

<!-- HERO: video nhà máy toàn màn hình -->
<div class="hero" id="hero">
  <canvas id="factoryCanvas" aria-hidden="true"></canvas>
  <video id="heroVideo" muted loop playsinline autoplay hidden></video>
  <div class="shade"></div>
  <div class="hero-inner">
    <div class="eyebrow" data-i18n="heroEyebrow"></div>
    <h1><span class="gold-text">CEO</span> Digital Card <span class="gold-text">5.0</span></h1>
    <p class="lead" data-i18n="heroLead"></p>
    <div class="vid-switch" id="vidSwitch"></div>
  </div>
  <div class="scroll-cue"></div>
</div>

<!-- THẺ NFC 3D -->
<section id="card">
  <div class="sec-head reveal">
    <div class="eyebrow">Interactive NFC 3D</div>
    <h2 data-i18n="cardTitle"></h2>
    <div class="divider"></div>
  </div>
  <div class="card-stage reveal">
    <div class="card3d" id="card3d" tabindex="0" role="button" aria-label="Flip card">
      <div class="flipper">
        <div class="face front">
          <div class="glare"></div><div class="border"></div>
          <div class="f-top">
            <div style="display:flex;align-items:center;gap:10px"><img src="assets/logo-gold.png" alt="" style="width:clamp(28px,8vw,40px)"><div class="f-logo gold-text">TUẤN TÚ<small>PACKAGING</small></div></div>
            <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="#d6ba80" stroke-width="1.6" stroke-linecap="round"><path d="M6 8.5a5 5 0 0 1 0 7"/><path d="M9.5 6a9 9 0 0 1 0 12"/><path d="M13 3.5a13 13 0 0 1 0 17"/></svg>
          </div>
          <div class="chipgold"></div>
          <div class="f-name"><b class="gold-text" data-bind="name"></b><span data-i18n="title"></span></div>
        </div>
        <div class="face back">
          <div class="glare"></div><div class="border"></div>
          <div class="back-grid">
            <div class="back-info">
              <div class="t" data-i18n="company"></div>
              <div>☎ <span data-bind="phone"></span></div>
              <div>✉ <span data-bind="email"></span></div>
              <div>⌂ <span data-bind="website"></span></div>
              <div style="color:var(--muted)" data-i18n="address"></div>
            </div>
            <div class="qrbox" id="cardQR"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="card-hint" data-i18n-html="cardHint"></p>

  <div class="profile reveal">
    <div class="avatar"><div id="avatar"></div></div>
    <div>
      <h3 data-bind="name"></h3>
      <div class="role" data-i18n="title"></div>
      <p class="quote" data-i18n="quote"></p>
    </div>
  </div>

  <div class="actions reveal">
    <a class="act" id="aCall"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span data-i18n="call"></span></a>
    <a class="act" id="aZalo" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h4l-4 4h4M15 9v4"/></svg><span>Zalo</span></a>
    <a class="act" id="aWechat"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="6"/><circle cx="16" cy="15" r="5"/><path d="M7 9h.01M11 9h.01"/></svg><span>WeChat</span></a>
    <a class="act" id="aMail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Email</span></a>
    <a class="act" id="aWeb" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Website</span></a>
    <a class="act" id="aShare"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span data-i18n="share"></span></a>
  </div>
  <button class="btn-primary reveal" id="saveContact" data-i18n="saveContact"></button>
</section>

<!-- NĂNG LỰC -->
<section id="about">
  <div class="sec-head reveal">
    <div class="eyebrow" data-i18n="aboutEyebrow"></div>
    <h2 data-i18n="aboutTitle"></h2>
    <div class="divider"></div>
  </div>
  <div class="stats" id="stats"></div>
</section>

<!-- DIGITAL SHOWROOM -->
<section id="showroom">
  <div class="sec-head reveal">
    <div class="eyebrow">Digital Showroom</div>
    <h2 data-i18n="showroomTitle"></h2>
    <div class="divider"></div>
  </div>
  <div class="products" id="products"></div>
  <div class="capab" id="capab"></div>
</section>

<!-- BÁO GIÁ -->
<section id="quote">
  <div class="sec-head reveal">
    <div class="eyebrow" data-i18n="quoteEyebrow"></div>
    <h2 data-i18n="quoteTitle"></h2>
    <div class="divider"></div>
  </div>
  <form class="form reveal" id="quoteForm">
    <label><span data-i18n="fName"></span><input name="name" required></label>
    <label><span data-i18n="fCompany"></span><input name="company"></label>
    <label><span data-i18n="fPhone"></span><input name="phone" type="tel" required></label>
    <label><span data-i18n="fEmail"></span><input name="email" type="email"></label>
    <label><span data-i18n="fProduct"></span><select name="product" id="fProduct"></select></label>
    <label><span data-i18n="fQty"></span><input name="qty" inputmode="numeric" placeholder="10,000"></label>
    <label class="full"><span data-i18n="fNote"></span><textarea name="note"></textarea></label>
    <div class="form-actions">
      <button class="btn-primary" type="submit" data-i18n="send"></button>

const STATS = [[8,"+"],[50,"+"],[6,""],[5,"M+"]];

  '<svg viewBox="0 0 100 100"><path d="M20 38 50 24l30 14v34L50 86 20 72z"/><path d="M20 38l30 14 30-14M50 52v34"/><path d="M35 31l30 14"/></svg>',

  '<svg viewBox="0 0 100 100"><path d="M26 34h48l-4 52H30z"/><path d="M38 40V28a12 12 0 0 1 24 0v12"/><path d="M40 60h20M40 68h14"/></svg>',
];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- i18n ---------- */
function applyLang(l){
  lang=l; store.set('lang',l); const d=I18N[l];
  document.documentElement.lang = l==='zh'?'zh-CN':l;
  $$('[data-i18n]').forEach(e=>e.textContent=d[e.dataset.i18n]);
  $$('[data-i18n-html]').forEach(e=>e.innerHTML=d[e.dataset.i18nHtml]);
  $$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  $('#stats').innerHTML = STATS.map((s,i)=>`<div class="stat reveal in"><b class="gold-text" data-count="${s[0]}" data-suf="${s[1]}">${s[0]}${s[1]}</b><span>${d.stats[i]}</span></div>`).join('');
  $('#products').innerHTML = d.products.map((p,i)=>`<div class="prod reveal in"><div class="art">${ICONS[i]}</div><h4>${p[0]}</h4><p>${p[1]}</p></div>`).join('');
  $('#capab').innerHTML = d.caps.map((c,i)=>`<div class="cap reveal in"><i>${['I','II','III','IV'][i]}</i><div><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('');
  $('#fProduct').innerHTML = d.products.map(p=>`<option>${p[0]}</option>`).join('') + `<option>${l==='vi'?'Khác':l==='en'?'Other':'其他'}</option>`;
  buildVideoSwitch();
}
$$('.langs button').forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));

/* ---------- bind config ---------- */

/* ---------- actions ---------- */

function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- quote form ---------- */
function formText(){

/* ---------- 3D card: flip + tilt + glare ---------- */
const card=$('#card3d');
card.addEventListener('click',()=>card.classList.toggle('flip'));
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.classList.toggle('flip')}});
function tilt(x,y){ // x,y in -1..1
  card.style.transform=`rotateX(${-y*12}deg) rotateY(${x*16}deg)`;
  $$('.glare').forEach(g=>g.style.setProperty('--gx',`${x*40}%`));
}
card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();tilt((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1)});
card.addEventListener('pointerleave',()=>tilt(0,0));
window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tilt(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)))});
let idle=0;(function float(){idle+=.012;if(!card.matches(':hover'))$$('.glare').forEach(g=>g.style.setProperty('--gx',`${Math.sin(idle)*45}%`));requestAnimationFrame(float)})();

/* ---------- Hero: factory simulation canvas + video switch ---------- */
const cv=$('#factoryCanvas'),ctx=cv.getContext('2d'),vid=$('#heroVideo');
let W,H,t=0,simOn=true;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const sparks=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,v:Math.random()*.0008+.0002}));
function drawFactory(){
  if(!simOn)return;
  t+=1;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1814');g.addColorStop(1,'#0b0b0d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // light beams
  for(let i=0;i<4;i++){const x=W*(.15+i*.25)+Math.sin(t*.004+i)*30;const bg=ctx.createLinearGradient(x,0,x+120,H*.8);bg.addColorStop(0,'rgba(243,226,181,.10)');bg.addColorStop(1,'rgba(243,226,181,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(x-20,0);ctx.lineTo(x+40,0);ctx.lineTo(x+220,H*.85);ctx.lineTo(x+60,H*.85);ctx.fill()}
  // machines silhouettes
  ctx.fillStyle='#16140f';
  for(let i=0;i<6;i++){const mx=(i*W/5)-40, mh=H*(.18+((i*37)%5)/40);ctx.fillRect(mx,H*.62-mh,W/7,mh);ctx.fillStyle='rgba(214,186,128,.25)';ctx.fillRect(mx+10,H*.62-mh+12,W/7-20,2);ctx.fillStyle='#16140f'}
  // conveyor
  const cy=H*.66;ctx.fillStyle='#24211b';ctx.fillRect(0,cy,W,14);ctx.strokeStyle='rgba(214,186,128,.35)';ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
  for(let x=-(t*1.2)%26;x<W;x+=26){ctx.fillStyle='#3a342a';ctx.beginPath();ctx.arc(x,cy+7,4,0,7);ctx.fill()}
  // boxes moving
  const gap=Math.max(140,W/6);
  for(let x=(t*1.2)%gap-gap;x<W+gap;x+=gap){const bw=70,bh=46,by=cy-bh;
    const bx=x;const lg=ctx.createLinearGradient(bx,by,bx+bw,by+bh);lg.addColorStop(0,'#c9a96a');lg.addColorStop(1,'#7d6236');ctx.fillStyle=lg;ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#e7d3a3';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+14,by-10);ctx.lineTo(bx+bw+14,by-10);ctx.lineTo(bx+bw,by);ctx.fill();
    ctx.fillStyle='#5e4826';ctx.beginPath();ctx.moveTo(bx+bw,by);ctx.lineTo(bx+bw+14,by-10);ctx.lineTo(bx+bw+14,by+bh-10);ctx.lineTo(bx+bw,by+bh);ctx.fill();
    ctx.fillStyle='rgba(30,22,10,.55)';ctx.font='600 11px Cormorant Garamond, serif';ctx.fillText('TUẤN TÚ',bx+12,by+27)}
  // floating gold dust
  sparks.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=1;ctx.fillStyle=`rgba(243,226,181,${.25+.35*Math.sin(t*.03+p.x*20)**2})`;ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.s,0,7);ctx.fill()});
  requestAnimationFrame(drawFactory);
}
drawFactory();
function playVideo(src){simOn=false;cv.hidden=true;vid.hidden=false;vid.src=src;vid.play().catch(()=>{})}
function playSim(){vid.pause();vid.hidden=true;cv.hidden=false;if(!simOn){simOn=true;drawFactory()}}
let current='demo';
function buildVideoSwitch(){
  const d=I18N[lang], box=$('#vidSwitch');
  const names={line:d.vLine,warehouse:d.vWarehouse};
  let html=`<button class="chip ${current==='demo'?'on':''}" data-v="demo">▶ ${d.vDemo}</button>`;
  CONFIG.videos.forEach(v=>html+=`<button class="chip ${current===v.key?'on':''}" data-v="${v.key}">▶ ${names[v.key]||v.key}</button>`);
  html+=`<label class="chip">${d.vUpload}<input type="file" accept="video/*" id="vidUpload"></label>`;
  box.innerHTML=html;
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{current=b.dataset.v;if(current==='demo')playSim();else playVideo(CONFIG.videos.find(v=>v.key===current).src);buildVideoSwitch()});
  $('#vidUpload').onchange=e=>{const f=e.target.files[0];if(f){current='upload';playVideo(URL.createObjectURL(f));buildVideoSwitch()}};
}

/* ---------- topbar, reveal, count-up ---------- */
addEventListener('scroll',()=>$('#topbar').classList.toggle('solid',scrollY>60),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');
  e.target.querySelectorAll?.('[data-count]').forEach(countUp);io.unobserve(e.target)}),{threshold:.15});
function countUp(el){const end=+el.dataset.count,suf=el.dataset.suf,t0=performance.now();(function step(n){const p=Math.min(1,(n-t0)/1600),v=Math.round(end*(1-Math.pow(1-p,3)));el.textContent=v+suf;if(p<1)requestAnimationFrame(step)})(t0)}

applyLang(lang);
$$('.reveal').forEach(e=>io.observe(e));
io.observe($('#stats'));
